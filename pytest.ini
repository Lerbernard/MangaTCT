# The suite runs from the repository folder with `python -m pytest tests -q`
# and nothing else. The folder IS the `mangatl` package, so its parent has to
# be on sys.path for `import mangatl` to work; this puts it there for every
# run, so nobody has to know to set PYTHONPATH first (CI still does, which
# is harmless).
#
# `norecursedirs`: pytest's own list, plus `_to_delete`. `.gitignore` already
# keeps a `_to_delete/` folder out of the repository - it is where a test
# goes on its way out, on one machine - but pytest does not read .gitignore,
# so it collected them anyway: one imported a function editor.py no longer
# has, and another shares its name with the live test that replaced it, and
# either one stops the whole run at collection. What git does not see, the
# suite does not run. (Setting the option replaces pytest's defaults, so they
# are listed again.)
[pytest]
pythonpath = ..
testpaths = tests
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} _to_delete
