# The suite runs from the repository folder with `python -m pytest tests -q`
# and nothing else. The folder IS the `mangatl` package, so its parent has to
# be on sys.path for `import mangatl` to work; this puts it there for every
# run, so nobody has to know to set PYTHONPATH first (CI still does, which
# is harmless).
[pytest]
pythonpath = ..
testpaths = tests
