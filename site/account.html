<link rel="stylesheet" href="style.css">
<!-- The theme, before the stylesheet paints: applied after first paint it is
     a white flash on a dark page, every load.

     `js` hides the sections so they can be revealed on scroll, and the timer
     is the undo. These pages load their script from a CDN as a module, and a
     module that never arrives - blocked, offline, one syntax error - would
     otherwise leave a page of invisible sections and no way back. `initChrome`
     sets `chrome` the moment it runs; if it has not run in two and a half
     seconds, nothing is going to reveal anything and the page stops hiding. -->
<script>try{var d=document.documentElement,t=localStorage.getItem('tct-theme');
if(t)d.dataset.theme=t;d.classList.add('js');
setTimeout(function(){if(!d.dataset.chrome)d.classList.remove('js')},2500)}catch(e){}</script>

  <a class="brand" href="index.html"><svg class="mk" viewBox="0 0 64 64" width="26" height="26" aria-hidden="true"><defs>
  <linearGradient id="ag" x1="0" y1="0" x2=".25" y2="1">
    <stop offset="0" stop-color="#ffc400"/><stop offset="1" stop-color="#ff9d00"/>

<main>
  <h1>Your account</h1>
  <p class="lede" id="who"></p>

  <!-- The balance first, and given room. It is the thing somebody opens this
       page to see, and after a payment it is the thing they are anxious
       about. -->
  <section class="sect reveal" id="purseBox">
    <div class="row spread" id="purse">
      <span class="dim">Loading...</span>
    </div>
    <div id="welcome" class="card" style="margin-top:16px" hidden></div>
  </section>

  <section class="sect reveal">
    <p class="eyebrow">Coins in and out</p>
    <h2>Everything that moved</h2>
    <div id="ledger"><p class="dim" style="margin:0">Loading...</p></div>
  </section>

  <section class="sect reveal plain">
    <p class="eyebrow">Profile</p>
    <h2>How people see you</h2>
    <div class="row" style="align-items:flex-start;gap:22px;flex-wrap:wrap">
      <div id="picNow"></div>
      <div style="flex:1;min-width:260px">
        <label for="name">Username</label>
        <input id="name" autocomplete="off" spellcheck="false"
               maxlength="20" placeholder="pick a name">
        <p class="hint" id="nameHint">Letters, numbers, dot, dash and
          underscore. Everyone's is different.</p>
        <button id="saveName" class="pri" style="margin-top:12px">Save name</button>
      </div>
    </div>

    <label style="margin-top:24px">Picture</label>
    <div class="picks" id="picks"></div>
    <p class="hint">Pick one. It saves as you press it.</p>
  </section>

  <p class="foot"><a href="pricing.html">Buy more coins</a> &middot;
    <span class="dim">Signed in as</span> <span id="mail" class="dim"></span></p>
</main>

<div id="toast" class="toast"></div>

<script type="module">
import {
  call, $, toast, saysWhat, whoAmI, needSignIn, COIN, esc, ICONS, iconSvg,
  auth, signOut, watchMe, db, doc, setDoc, collection, query, orderBy, limit,
  getDocs, initChrome, sendVerifyMail, nowVerified,
} from './app.js';

initChrome();

let uid = '', mine = null, user = null;

/* ------------------------------------------------------------------- purse */

function drawPurse(d) {
  $('purse').innerHTML = `
    <div class="row">${COIN}<span class="big">${Number(d.coins || 0)}</span>
      <span class="dim">coins</span></div>
    <div class="row">
      <a class="btn pri" href="pricing.html">Buy coins</a>
    </div>`;
}

/* ------------------------------------------------------------ the free coins

   A hundred coins for a new account, once its email is verified. The server
   gives them on the first `me` after the token says verified - see
   `welcomeIfDue` in the functions - so all this page does is notice, and ask.

   Shown only while there is something for the person to DO: the email is not
   yet verified and the coins have not been given. A Google sign-in is
   verified on arrival and never sees this; an address that already had its
   coins on an earlier account does not see it either, because being asked to
   verify for coins that will not come would be a lie with a button on it. */
let welcomeSaid = false;

function drawWelcome(w, verified) {
  const box = $('welcome');
  if (!w || !w.due || verified) { box.hidden = true; return; }
  box.hidden = false;
  box.innerHTML = `
    <div class="row spread" style="gap:14px;flex-wrap:wrap">
      <div><b>${Number(w.coins)} free coins are waiting.</b>
        <span class="dim">Click the link we emailed to
        <span id="wmail"></span> and they land here.</span></div>
      <div class="row">
        <button id="wcheck" class="pri">I clicked it</button>
        <button id="wsend">Send it again</button>
      </div>
    </div>`;
  $('wmail').textContent = (user && user.email) || 'your address';
  $('wcheck').onclick = () => checkWelcome(true);
  $('wsend').onclick = async () => {
    $('wsend').disabled = true;
    const ok = await sendVerifyMail(user);
    toast(ok ? 'Sent. Look for a mail from MangaTCT - the spam folder too.'
             : 'Could not send it just now. Try again in a minute.', !ok);
    setTimeout(() => { $('wsend').disabled = false; }, 30000);
  };
}

/* Asks the server, with a fresh token, whether the coins are due now. Called
   on load, when the page comes back from the link (`?verified=1`), when the
   tab regains focus - somebody clicks the link in a mail tab and comes back to
   this one - and when the button is pressed. */
async function checkWelcome(pressed) {
  const verified = await nowVerified(user);
  let data = {};
  try { ({ data } = await call('me')()); } catch { return; }
  drawWelcome(data.welcome, verified || data.verified);
  if (data.welcome && data.welcome.given && !welcomeSaid) {
    welcomeSaid = true;
    toast(`Your ${data.welcome.coins} free coins have landed.`);
    setTimeout(drawLedger, 800);
  } else if (pressed && !verified) {
    toast('Not verified yet. Open the mail and click the link first.', true);
  }
}

/* ----------------------------------------------------------------- profile */

function drawPic(id) {
  $('picNow').innerHTML = iconSvg(id || ICONS[0], 96);
  for (const b of $('picks').children) b.className = b.dataset.p === id ? 'on' : '';
}

async function setPic(id) {
  drawPic(id);
  try {
    // Written straight to Firestore, not through a function. The rules let a
    // person write these two fields on their own document and nothing else. A
    // picture is not money, and routing it through a callable would only be a
    // slower way to reach the same rule.
    await setDoc(doc(db, 'users', uid), { photo: id }, { merge: true });
  } catch (e) { toast(saysWhat(e), true); }
}

async function saveName() {
  const want = $('name').value.trim();
  if (!want) return;
  $('saveName').disabled = true;
  try {
    const { data } = await call('claimUsername')({ username: want });
    $('name').value = data.username;
    $('nameHint').className = 'hint good';
    $('nameHint').textContent = 'Saved.';
    $('who').textContent = 'Hello, ' + data.username + '.';
  } catch (e) {
    $('nameHint').className = 'hint bad';
    $('nameHint').textContent = saysWhat(e);
  }
  $('saveName').disabled = false;
}

/* Says "taken" while somebody types, so the answer does not arrive only after
   they have committed to a name. Debounced, because a call per keystroke is a
   call per keystroke. */
let tap;
function typing() {
  clearTimeout(tap);
  const want = $('name').value.trim();
  if (!want || want === (mine && mine.username)) {
    $('nameHint').className = 'hint';
    $('nameHint').textContent = 'Letters, numbers, dot, dash and underscore.';
    return;
  }
  tap = setTimeout(async () => {
    try {
      const { data } = await call('usernameFree')({ username: want });
      $('nameHint').className = 'hint ' + (data.free ? 'good' : 'bad');
      $('nameHint').textContent = data.free ? 'That one is free.'
        : (data.why || 'Not that one.');
    } catch { /* the Save button will say it properly */ }
  }, 400);
}

/* ------------------------------------------------------------------ ledger

   Four kinds, and only two of them are money coming IN.

   This used to read `kind !== 'spend'`, which put a clawback on the green side
   with a plus in front of it: lee refunded a $4.99 pack and the page told him
   he had been GIVEN five hundred coins for it. The balance was right the whole
   time, which is what made it a lie rather than a bug. The list of what adds
   is now written out, so a fifth kind arriving later is shown as a subtraction
   until somebody decides otherwise, and being wrong in that direction is a
   question rather than a gift. */
const IN = new Set(['credit', 'refund']);
const WORDS = {
  spend: 'Spent on',
  refund: 'Given back',
  credit: 'Bought',
  clawback: 'Taken back',
};

/* `pack pack1` on a customer's page, twice over, because the server writes
   `pack ${id}` and the page put a word in front of it. The id means nothing to
   the person reading it; the size does.

   The sizes are not written here. They come from `me`, which returns `PACKS`
   out of `purse.js`, which is the same list that grants the coins. A pack
   renamed there is renamed here, and a pack this page has never heard of is
   left exactly as the server wrote it rather than guessed at. */
let PACKS = {};
function saysWhatFor(r) {
  let what = String(r.what || '');
  what = what.replace(/\bpack (pack\d+)\b/g,
    (m, id) => (PACKS[id] ? 'the ' + PACKS[id] + ' pack' : m));
  // The server tags a clawback `... - refunded`, which is the right thing for
  // it to write down and the wrong thing to read twice: "Taken back the 500
  // coins pack, refunded" says it once too often. The word in front is the one
  // that carries it, so the tag comes off here.
  what = what.replace(/\s*[-|\u2013\u2014]\s*refunded\s*$/i, '');
  // The hundred free coins are written as a credit called `welcome`; "Bought
  // welcome" is not what happened.
  if (r.kind === 'credit' && what === 'welcome') return 'Free coins for signing up';
  return `${WORDS[r.kind] || r.kind} ${what}`.trim();
}

async function drawLedger() {
  let rows = [];
  try {
    const q = query(collection(db, 'users', uid, 'ledger'),
                    orderBy('at', 'desc'), limit(50));
    rows = (await getDocs(q)).docs.map((d) => d.data());
  } catch (e) {
    $('ledger').innerHTML = `<p class="dim" style="margin:0">${
      esc(saysWhat(e))}</p>`;
    return;
  }
  if (!rows.length) {
    $('ledger').innerHTML = '<p class="dim" style="margin:0">Nothing yet. '
      + 'Every coin in and every coin out shows up here.</p>';
    return;
  }
  $('ledger').innerHTML = `<table>
    <tr><th>When</th><th>What</th><th class="n">Coins</th></tr>
    ${rows.map((r) => {
      const plus = IN.has(r.kind);
      const when = r.at && r.at.toDate ? r.at.toDate().toLocaleString(undefined,
        { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
        : '';
      return `<tr><td class="dim">${esc(when)}</td>
        <td>${esc(saysWhatFor(r))}${
          r.page ? ` <span class="dim">${esc(r.page)}</span>` : ''}</td>
        <td class="n ${plus ? 'plus' : 'minus'}">${plus ? '+' : '−'}${
          Number(r.coins || 0)}</td></tr>`;
    }).join('')}</table>`;
}

/* -------------------------------------------------------------------- boot */

(async () => {
  const u = await whoAmI();
  if (needSignIn(u)) return;
  uid = u.uid;
  user = u;
  $('mail').textContent = u.email || '';
  $('out').onclick = async () => {
    await signOut(auth);
    location.href = 'signin.html';
  };

  $('picks').innerHTML = ICONS.map((id) =>
    `<button data-p="${esc(id)}" title="${esc(id)}">${iconSvg(id, 40)}</button>`
  ).join('');
  for (const b of $('picks').children) b.onclick = () => setPic(b.dataset.p);

  $('saveName').onclick = saveName;
  $('name').oninput = typing;
  $('name').onkeydown = (e) => { if (e.key === 'Enter') saveName(); };

  watchMe(uid, (d) => {
    if (!d) return;
    mine = d;
    drawPurse(d);
    if (document.activeElement !== $('name')) $('name').value = d.username || '';
    $('who').textContent = d.username ? 'Hello, ' + d.username + '.'
      : 'Pick a username below. It is how anyone else sees you.';
    drawPic(d.photo || ICONS[0]);
  });

  // The pack names, before the ledger is drawn with them in it. If this call
  // fails the ledger still draws, saying `pack pack1` as the server wrote it.
  // The same call is where the free coins land once the email is verified,
  // so the token is refreshed first if the link has just been clicked.
  const verified = await nowVerified(u);
  try {
    const { data } = await call('me')();
    for (const q of data.packs || []) {
      PACKS[q.id] = Number(q.coins).toLocaleString() + ' coins';
    }
    drawWelcome(data.welcome, verified || data.verified);
    if (data.welcome && data.welcome.given) {
      welcomeSaid = true;
      toast(`Your ${data.welcome.coins} free coins have landed.`);
    }
  } catch { /* the ledger reads a little worse and nothing else changes */ }

  drawLedger();

  // Somebody clicks the link in their mail tab and comes back to this one.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !$('welcome').hidden) checkWelcome(false);
  });

  // Straight back from Stripe. The webhook may not have landed yet; the
  // balance is watched, so it will simply appear.
  if (new URLSearchParams(location.search).get('paid')) {
    toast('Payment taken. Your coins will land in a moment.');
    setTimeout(drawLedger, 4000);
  }
})();
</script>
